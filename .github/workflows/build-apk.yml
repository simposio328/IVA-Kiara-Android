
name: Build IVA Kiara APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP=$(find . -type f -name "IVA_Kiara_Android_Studio_Project.zip" -print -quit)
          test -n "$ZIP" || { echo "Android ZIP not found"; exit 1; }
          unzip "$ZIP" -d progetto
          PROJECT_DIR=$(dirname "$(find progetto -name settings.gradle -print -quit)")
          test -n "$PROJECT_DIR" || { echo "settings.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IVA-Kiara-APK
          path: progetto/**/app/build/outputs/apk/debug/*.apk


