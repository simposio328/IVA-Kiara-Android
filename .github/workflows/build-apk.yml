name: Build IVA Kiara APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Estrai progetto Android
        run: |
          ZIP=$(find . -type f -name "IVA_Kiara_Android_Studio_Project.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP Android non trovato"
            exit 1
          fi
          unzip "$ZIP" -d progetto
          PROJECT_DIR=$(dirname "$(find progetto -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configura Android
        uses: android-actions/setup-android@v3

      - name: Compila APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: IVA-Kiara-APK
          path: progetto/**/app/build/outputs/apk/debug/*.apk

